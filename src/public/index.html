<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Feed — RAID/OPS Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d10;
    --panel: #10151a;
    --panel-border: #1e2830;
    --amber: #ff9500;
    --cyan: #3fd8e0;
    --text-primary: #e8edf0;
    --text-dim: #6b7a85;
    --analyst-color: #3fd8e0;
    --fan-color: #ff9500;
    --live-red: #ff3b3b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    /* Android Chrome inflates text in wide blocks ("font boosting") unless
       this is set. iOS inflates on rotate. Both are fixed by the same line. */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Archivo', sans-serif;
    /* 100vh includes the area behind the collapsing mobile address bar and
       causes a scroll jump on both platforms. dvh tracks the real viewport. */
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 20px 60px;
    /* stop an accidental downward swipe from reloading the page and
       dropping the WebSocket */
    overscroll-behavior-y: contain;
  }

  .console {
    max-width: 920px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-top: 4px;
  }

  .live-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .live-dot.active {
    background: var(--live-red);
    box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.6);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(255, 59, 59, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0); }
  }

  #status-bar {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--cyan);
  }

  .feed { display: flex; flex-direction: column; gap: 14px; }

  .entry {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
    animation: slideIn 0.3s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-border);
  }

  .teams {
    font-weight: 600;
    font-size: 15px;
    overflow-wrap: anywhere;
    min-width: 0;
  }

  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
  }

  .digest-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  @media (max-width: 640px) {
    body { padding: 14px 12px 40px; }

    /* single column digests */
    .digest-row { grid-template-columns: 1fr; }
    .digest-cell.analyst {
      border-right: none;
      border-bottom: 1px solid var(--panel-border);
    }

    /* stack the page header instead of squeezing it */
    header {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    h1 { font-size: 21px; }

    /* stack match name above venue/time so neither gets crushed */
    .entry-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 12px 14px;
    }
    .meta { text-align: left; }

    .digest-cell { padding: 12px 14px; }

    /* 16px is the threshold below which iOS Safari force-zooms on focus.
       Do not lower these. */
    .picker select,
    .picker button {
      font-size: 16px;
      padding: 12px;
      min-height: 48px;
    }
    .picker-row { gap: 6px; }
    .picker-row select { flex: 1 1 auto; min-width: 0; }
    .picker-row button { flex: 0 0 auto; }
    .picker { padding: 12px; }
    #status-bar { font-size: 11.5px; padding: 10px 12px; }
    .livebar { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; }
    .livebar-score { font-size: 16px; }
    #digest-now { width: 100%; min-height: 48px; font-size: 16px; }
  }

  @media (max-width: 380px) {
    h1 { font-size: 19px; }
    .picker-row select { flex-basis: 100%; }
    .picker-row button { width: 100%; }
  }

  .digest-cell {
    padding: 14px 16px;
  }

  .digest-cell.analyst { border-right: 1px solid var(--panel-border); }

  .digest-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .digest-sublabel {
    font-family: 'Archivo', sans-serif;
    font-size: 10.5px;
    font-style: italic;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .digest-cell.analyst .digest-label { color: var(--analyst-color); }
  .digest-cell.fan .digest-label { color: var(--fan-color); }

  .digest-text {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text-primary);
    overflow-wrap: anywhere;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .picker {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .picker-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .picker select, .picker button {
    background: var(--bg);
    color: var(--text-primary);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }

  .picker select:focus, .picker button:focus {
    outline: none;
    border-color: var(--cyan);
  }

  #match-select { width: 100%; }

  /* Android Chrome renders <option> in a native popup. Without these it can
     inherit the near-white page text onto a white system background. */
  .picker select option {
    background-color: #10151a;
    color: #e8edf0;
  }

  .picker button:hover { border-color: var(--amber); color: var(--amber); }

  .picker button[disabled] { opacity: 0.5; cursor: default; }

  .livebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }

  .livebar-main { min-width: 0; }

  .livebar-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
    overflow-wrap: anywhere;
  }

  .livebar-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    overflow-wrap: anywhere;
  }

  #digest-now {
    flex: 0 0 auto;
    background: var(--bg);
    color: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 3px;
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }

  #digest-now:hover:not([disabled]) { background: var(--amber); color: var(--bg); }
  #digest-now[disabled] { opacity: 0.45; cursor: default; }

  .picker-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--text-dim);
    margin-top: 10px;
  }

  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--panel-border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="console">
    <header>
      <div>
        <div class="eyebrow">Live Match Intelligence</div>
        <h1>Cricket Digest Console</h1>
      </div>
      <div class="live-pill">
        <div class="live-dot" id="live-dot"></div>
        <span id="conn-status">Connecting…</span>
      </div>
    </header>

    <div class="picker">
      <div class="picker-row">
        <select id="filter-level">
          <option value="all">All levels</option>
          <option value="International">International</option>
          <option value="Domestic">Domestic</option>
        </select>
        <select id="filter-state">
          <option value="all">Live + Scheduled</option>
          <option value="in">Live only</option>
          <option value="pre">Scheduled only</option>
          <option value="post">Finished</option>
        </select>
        <button id="refresh-matches" type="button">Refresh</button>
      </div>
      <select id="match-select"><option>Loading matches…</option></select>
      <div class="picker-note" id="picker-note"></div>
    </div>

    <div class="livebar" id="livebar">
      <div class="livebar-main">
        <div class="livebar-score" id="lb-score">—</div>
        <div class="livebar-sub" id="lb-sub">Waiting for first poll…</div>
      </div>
      <button id="digest-now" type="button">Digest now</button>
    </div>

    <div id="status-bar">Waiting for first poll…</div>

    <div class="feed" id="feed">
      <div class="empty-state">No digests generated yet. Once a live match updates, entries will appear here.</div>
    </div>

    <footer>
      Source: ESPN Cricket API → Claude (Analyst / Fan digest) · Polls every few minutes
    </footer>
  </div>

  <script>
    const feed = document.getElementById('feed');
    const statusBar = document.getElementById('status-bar');
    const liveDot = document.getElementById('live-dot');
    const connStatus = document.getElementById('conn-status');

    // Render serves an HTML loading page while a sleeping service wakes, and
    // Express serves HTML for unknown routes. Parsing either as JSON gives the
    // opaque "Unexpected token '<'" error, so check before parsing.
    async function callApi(url, options) {
      const res = await fetch(url, options);
      const body = await res.text();
      const looksHtml = body.trimStart().startsWith('<');

      if (looksHtml) {
        if (res.status === 404) {
          throw new Error('Server is missing this endpoint — deploy may be out of date.');
        }
        throw new Error('Server is waking up. Wait a few seconds and try again.');
      }

      let data;
      try { data = JSON.parse(body); }
      catch { throw new Error(`Unreadable response (HTTP ${res.status})`); }

      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }


    const lbScore = document.getElementById('lb-score');
    const lbSub = document.getElementById('lb-sub');
    const digestNowBtn = document.getElementById('digest-now');

    function renderSnapshot(s) {
      if (!s) return;
      lbScore.textContent = `${s.teams} — ${s.score}`;
      const bits = [];
      if (s.format) bits.push(s.format);
      if (s.runRate != null) bits.push(`RR ${s.runRate}`);
      if (s.session) bits.push(s.session);
      if (s.statusDetail) bits.push(s.statusDetail);
      if (s.batters && s.batters.length) {
        bits.push(s.batters.map(b => `${b.name} ${b.runs}(${b.balls})`).join(', '));
      }
      bits.push(`checked ${new Date(s.at).toLocaleTimeString()}`);
      lbSub.textContent = bits.join(' · ');

      // ESPN lists some fixtures without scoring them at all.
      const noData = s.hasScorecard === false;
      digestNowBtn.disabled = noData;
      if (noData) {
        lbScore.textContent = `${s.teams} — no scorecard`;
        lbSub.textContent = s.liveDataAvailable
          ? 'ESPN has not published a scorecard for this match yet.'
          : 'ESPN lists this fixture but does not provide live scoring for it. Pick another match.';
      }
    }

    digestNowBtn.addEventListener('click', async () => {
      digestNowBtn.disabled = true;
      const original = digestNowBtn.textContent;
      digestNowBtn.textContent = 'Thinking…';
      try {
        await callApi('/api/digest-now', { method: 'POST' });
        // the digest also arrives over the WebSocket; nothing more to do here
      } catch (err) {
        statusBar.textContent = `Could not generate digest: ${err.message}`;
      } finally {
        digestNowBtn.textContent = original;
        digestNowBtn.disabled = false;
      }
    });

    // The feed is derived from `entries`, never appended to blindly. The server
    // replays full history on every WebSocket connection, and mobile drops the
    // socket constantly (backgrounding, screen lock), so an append-only feed
    // duplicates every entry on each reconnect.
    let entries = [];

    const entryKey = (e) => `${e.matchId}|${e.generatedAt}`;

    function entryHtml(entry) {
      return `
        <div class="entry-head">
          <div class="teams">${entry.teams}</div>
          <div class="meta">${entry.venue}<br>${new Date(entry.generatedAt).toLocaleTimeString()}</div>
        </div>
        <div class="digest-row">
          <div class="digest-cell analyst">
            <div class="digest-label">Analyst</div>
            <div class="digest-sublabel">"Give me the facts behind the moment."</div>
            <div class="digest-text">${entry.analystDigest}</div>
          </div>
          <div class="digest-cell fan">
            <div class="digest-label">Fan</div>
            <div class="digest-sublabel">"Tell me why this moment matters."</div>
            <div class="digest-text">${entry.fanDigest}</div>
          </div>
        </div>
      `;
    }

    function renderFeed() {
      if (entries.length === 0) {
        feed.innerHTML = '<div class="empty-state">No digests yet. Once the match moves, entries appear here.</div>';
        return;
      }
      feed.innerHTML = '';
      for (const entry of entries) {           // entries[0] is newest
        const el = document.createElement('div');
        el.className = 'entry';
        el.innerHTML = entryHtml(entry);
        feed.appendChild(el);
      }
    }

    /** Merge new entries in, dropping any we already have. */
    function mergeEntries(incoming) {
      const seen = new Set(entries.map(entryKey));
      let added = 0;
      for (const e of incoming) {
        if (seen.has(entryKey(e))) continue;
        seen.add(entryKey(e));
        entries.push(e);
        added++;
      }
      entries.sort((a, b) => new Date(b.generatedAt) - new Date(a.generatedAt));
      if (entries.length > 50) entries.length = 50;
      if (added) renderFeed();
      return added;
    }

    // ---- match picker ----------------------------------------------------
    const matchSelect = document.getElementById('match-select');
    const filterLevel = document.getElementById('filter-level');
    const filterState = document.getElementById('filter-state');
    const refreshBtn = document.getElementById('refresh-matches');
    const pickerNote = document.getElementById('picker-note');

    let allMatches = [];
    let tracking = null;

    function renderMatchOptions() {
      const level = filterLevel.value;
      const state = filterState.value;

      const visible = allMatches.filter(m =>
        (level === 'all' || m.level === level) &&
        (state === 'all' ? m.state !== 'post' : m.state === state)
      );

      if (visible.length === 0) {
        matchSelect.innerHTML = '<option>No matches match these filters</option>';
        return;
      }

      // Native <select> pickers on Android truncate long options with an
      // ellipsis, so drop the series name and level on narrow screens.
      const narrow = window.innerWidth < 640;

      matchSelect.innerHTML = visible.map(m => {
        const badge = m.state === 'in' ? '● LIVE'
          : m.state === 'post' ? '· done'
          : '○ ' + (narrow ? m.startIST.replace(' IST', '') : m.startIST);
        const sel = tracking && tracking.eventId === m.eventId ? ' selected' : '';

        const name = narrow && m.shortName ? m.shortName : m.matchName;
        const tail = narrow
          ? `  ·  ${m.format}`
          : `  ·  ${m.format} ${m.level === 'International' ? 'Intl' : 'Dom'}  ·  ${m.seriesName}`;

        return `<option value="${m.leagueId}|${m.eventId}"${sel}>${badge}  ·  ${name}${tail}</option>`;
      }).join('');
    }

    async function loadMatches(force) {
      try {
        const data = await callApi('/api/matches' + (force ? '?force=true' : ''));
        allMatches = data.matches;
        tracking = data.tracking;
        renderMatchOptions();
        pickerNote.textContent =
          `${data.counts.live} live · ${data.counts.scheduled} scheduled · `
          + `${data.counts.international} international · ${data.counts.domestic} domestic`;
      } catch (err) {
        matchSelect.innerHTML = `<option>Could not load matches: ${err.message}</option>`;
      }
    }

    matchSelect.addEventListener('change', async () => {
      const [leagueId, eventId] = matchSelect.value.split('|');
      if (!leagueId || !eventId) return;
      const chosen = allMatches.find(m => m.eventId === eventId);
      matchSelect.disabled = true;
      statusBar.textContent = `Switching to ${chosen ? chosen.matchName : eventId}…`;
      try {
        const out = await callApi('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ leagueId, eventId, seriesName: chosen && chosen.seriesName })
        });
        tracking = out.tracking;
        statusBar.textContent =
          `Now tracking ${chosen ? chosen.matchName : eventId}. Establishing baseline — `
          + `the next digest arrives when something material happens.`;
      } catch (err) {
        statusBar.textContent = `Could not switch match: ${err.message}`;
      } finally {
        matchSelect.disabled = false;
      }
    });

    filterLevel.addEventListener('change', renderMatchOptions);
    filterState.addEventListener('change', renderMatchOptions);
    refreshBtn.addEventListener('click', () => loadMatches(true));

    // re-render labels when the phone rotates across the breakpoint
    let lastNarrow = window.innerWidth < 640;
    window.addEventListener('resize', () => {
      const nowNarrow = window.innerWidth < 640;
      if (nowNarrow !== lastNarrow) { lastNarrow = nowNarrow; renderMatchOptions(); }
    });

    loadMatches(false);
    setInterval(() => loadMatches(false), 120000);

    let socket = null;

    let reconnectTimer = null;

    function connect() {
      // Never run two sockets at once. onclose schedules a retry and
      // visibilitychange can also reconnect; without this guard both fire and
      // each socket replays history independently.
      if (socket && (socket.readyState === WebSocket.OPEN ||
                     socket.readyState === WebSocket.CONNECTING)) return;
      clearTimeout(reconnectTimer);

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${window.location.host}`);
      socket = ws;

      ws.onopen = () => {
        connStatus.textContent = 'Connected';
        liveDot.classList.add('active');
      };

      ws.onclose = () => {
        if (socket !== ws) return;   // superseded by a newer socket
        connStatus.textContent = 'Disconnected — retrying…';
        liveDot.classList.remove('active');
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 3000);
      };

      ws.onmessage = (event) => {
        const payload = JSON.parse(event.data);

        if (payload.type === 'history') {
          mergeEntries(payload.history || []);
          if (entries.length === 0) {
            statusBar.textContent = 'No digests yet. Waiting for the match to move.';
          }
        } else if (payload.type === 'digest') {
          if (mergeEntries([payload.entry])) {
            statusBar.textContent = `Last update: ${payload.entry.teams} at ${new Date(payload.entry.generatedAt).toLocaleTimeString()}`;
          }
        } else if (payload.type === 'status') {
          statusBar.textContent = `${payload.message} (checked ${new Date(payload.checkedAt).toLocaleTimeString()})`;
        } else if (payload.type === 'baseline') {
          renderSnapshot(payload.snapshot);
          statusBar.textContent = 'Tracking started. Next digest arrives when something material happens — or hit "Digest now".';
        } else if (payload.type === 'tick') {
          renderSnapshot(payload.snapshot);
          statusBar.textContent = 'No material change since last check.';
        } else if (payload.type === 'nodata') {
          statusBar.textContent = `${payload.match}: ${payload.message}`;
        } else if (payload.type === 'tracking') {
          loadMatches(true);
        } else if (payload.type === 'error') {
          statusBar.textContent = `⚠ ${payload.scope} error: ${payload.message}`;
        }
      };
    }

    connect();

    // iOS Safari and Android Chrome both suspend WebSockets when the tab is
    // backgrounded or the screen locks, and the close event does not reliably
    // fire. Without this the dashboard comes back showing "Connected" while
    // the socket is dead. Re-check on resume and reconnect if needed.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      connect(); // no-ops if the socket is still healthy
      loadMatches(false); // list may be stale after time in the background
    });
  </script>
</body>
</html>
